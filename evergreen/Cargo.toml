[package]
name = "evergreen"
version = "0.2.0-alpha"
edition = "2024"
homepage = "https://firesidexr.com/evergreen"
readme = "../README.md"
description = "Network backend build on libp2p"
repository = "https://github.com/FiresideXR/evergreen-rs"
license = "Apache-2.0"
keywords = ["gamedev", "networking", "iroh", "firesidexr", "evergreen"]
categories = ["network-programming", "game-development"]
include = ["../README.md"]

[dependencies]
chrono = "0.4.41"
futures = "0.3.31"
iroh = "1.0.0"
iroh-tickets = "1.0.0"
#postcard = { version = "1.1.3", features = ["alloc"] }
protobuf = "4.35.0-release"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.47.0", features = ["full"] }
tokio-util = "0.7.18"

[dev-dependencies]
anyhow = "1.0.102"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
protobuf-codegen = "4.35.0-release"
